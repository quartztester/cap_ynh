# cap — nginx reverse proxy. Root-install only (enforced in scripts/install:
# the app issues root-absolute redirects — /login bounce, /share — that
# would escape any subpath, so no __PATH__ juggling here).
#
# SSO model (see manifest [resources.permissions]):
#   - `main` permission is PUBLIC on the whole path: visitors of sites that
#     embed the widget must fetch/redeem challenges anonymously.
#   - `admin` permission (regex: /server, /auth, /public) is protected by
#     the YunoHost portal; ssowat gates those, and by longest-match never
#     the captcha routes. The root "/" itself falls to the public `main`
#     match (tie), which only ever shows cap's own login form — useless
#     without the admin key, and its /auth/login submit is portal-gated.
# nginx here only proxies; authorization is ssowat's job. Pass the real
# client IP — cap reads X-Forwarded-For by default (nginx overwrites it
# with the true peer address, so client-forged copies are stripped).
#
# NB: location regexes containing { } quantifiers MUST be quoted or nginx
# tokenizes the brace as the block opener ("unknown directive" emerg).

# Visitor hot path: challenge + redeem (POST /<siteKey>/challenge|redeem).
# Lean: no access_log noise from bot-heavy sites, small bodies, short
# timeouts.
location ~ "^/[0-9a-f]{10}/(challenge|redeem)$" {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16k;
    proxy_read_timeout 15s;
    access_log off;
}

# Server-side verification endpoint (customer backends call this).
location = /siteverify {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
    access_log off;
}

# Health probes (monitoring), public by design in the app.
location ~ "^/health(/live)?$" {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
}

# Optional self-hosted widget/wasm mirror (ENABLE_ASSETS_SERVER=true).
# Public; only ever serves the app's own cached copies of pinned
# @cap.js/widget and @cap.js/wasm files.
location /assets/ {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}

# Share-link stats (read-only, token-scoped) — public like the captcha
# endpoints by upstream design.
location /share {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Everything else: dashboard, /auth/login, /server/* API, /public/* assets.
location / {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}
