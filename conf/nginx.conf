# Root-install only (enforced in scripts/install): cap issues root-absolute redirects (/login, /share) that would escape any subpath.
# Authorization is ssowat's job via the manifest permissions (main public, admin regex portal-gated); nginx here only proxies.
# Pass the real client IP — cap reads X-Forwarded-For by default, and nginx overwrites client-forged copies.
# NB: location regexes containing { } quantifiers MUST be quoted or nginx tokenizes the brace as the block opener ("unknown directive").

# Visitor hot path (bot-heavy sites): small bodies, short timeouts, no access_log noise.
location ~ "^/[0-9a-f]{10}/(challenge|redeem)$" {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16k;
    proxy_read_timeout 15s;
    access_log off;
}

location = /siteverify {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
    access_log off;
}

# Health probes (monitoring), public by design in the app.
location ~ "^/health(/live)?$" {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
}

# Optional self-hosted widget/wasm mirror (ENABLE_ASSETS_SERVER=true); only serves the app's own cached pinned copies.
location /assets/ {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}

# Share-link stats (read-only, token-scoped) — public by upstream design.
location /share {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}
