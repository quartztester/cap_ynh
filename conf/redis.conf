# cap — private per-app redis instance.
# Own config/port/dump under $data_dir: the shared system redis is never
# touched and other apps' data is never mixed with this instance's keys
# (sessions, site keys, rate-limit counters). RDB snapshotting matches
# upstream's own compose stack (valkey --save 60 1, noeviction): key and
# session loss on power cut would break live captcha verifications.

port __REDIS_PORT__
bind 127.0.0.1 -::1
protected-mode yes
requirepass __REDIS_PASSWORD__
daemonize no
supervised systemd
pidfile __DATA_DIR__/redis/redis.pid
dir __DATA_DIR__/redis
dbfilename dump.rdb
save 60 1
appendonly no
maxmemory 128mb
maxmemory-policy noeviction
loglevel notice
logfile ""
